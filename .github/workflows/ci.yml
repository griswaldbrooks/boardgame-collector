# CI: frontend build + tests + lint/format, and Rust check/clippy/fmt.
#
# The Android APK build is deliberately NOT part of CI: it needs Android
# SDK/NDK + JDK provisioning (see AGENTS.md "Build") and is out of scope —
# APKs are built locally with `npm run android:build`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  rust:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # System libraries required by Tauri 2's host-target build on Linux
      # (cargo check/clippy link against webkit2gtk/gtk3 via pkg-config);
      # see https://v2.tauri.app/start/prerequisites/
      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo check
