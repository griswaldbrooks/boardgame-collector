# Release: on each merge to main, build the SIGNED release arm64 APK and
# attach it to a GitHub Release tagged from the app version in
# src-tauri/tauri.conf.json. A merge without a version bump is skipped
# (tag already exists) — see docs/adr/0006-release-pipeline.md.
#
# The tag format (vX.Y.Z) and the APK asset name
# (bgn-coordinator_<X.Y.Z>_arm64.apk) are the machine API for a future
# in-app self-updater; keep them stable.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the version tag already exists (re-uploads the APK)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Decide release tag
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version and check the tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          if [ "$EXISTS" = true ] && [ "${{ inputs.force }}" != true ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} already exists and this push has no version bump - skipping release. Bump version in src-tauri/tauri.conf.json to cut a new release (docs/adr/0006-release-pipeline.md)."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build signed arm64 APK and release
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android NDK and build-tools
        run: |
          SDKMANAGER=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "build-tools;36.0.0"
          {
            echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - run: npm ci

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "${RUNNER_TEMP}/release.keystore"

      - name: Build release arm64 APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64

      - name: Verify signature and rename to the stable asset name
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs -v "$APK"
          ASSET="bgn-coordinator_${{ needs.version.outputs.version }}_arm64.apk"
          cp "$APK" "$ASSET"
          echo "asset=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload APK artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: ${{ env.asset }}
          generate_release_notes: true
          make_latest: true
